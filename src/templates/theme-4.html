          mk.textContent = cd.mark;
          s.appendChild(mk);
        }
        cap.appendChild(s);
      }
      wrap.appendChild(cap);
      trio.appendChild(wrap);
    });
  }

  /* ---------- 页脚 ---------- */
  var fa = document.getElementById('footAuthor');
  var foot = document.getElementById('foot');
  /* 页脚：主题作者 + 分享者，两人都有就并排显示 */
  var aWho = String(P.author || '').trim();
  var sWho = String(P.sharer || '').trim();
  var who;
  if (aWho && sWho && aWho !== sWho) who = aWho + ' · ' + sWho;
  else who = aWho || sWho || 'Reeden';
  fa.textContent = who;
  foot.style.display = '';

  /* ---------- 模板参数（原样） ---------- */
  var PR2 = (payload && payload.params) ? payload.params : {};
  function pnum(k,d){ var v = Number(PR2[k]); return isFinite(v) ? v : d; }
  document.documentElement.style.setProperty('--poster-r', pnum('posterRadius',10) + 'px');
  document.documentElement.style.setProperty('--shot-r', pnum('shotRadius',4) + 'px');

  var html = document.documentElement;
  function flag(k,v){ html.setAttribute('data-param-' + k.replace(/[A-Z]/g,function(m){return '-'+m.toLowerCase();}), v?'true':'false'); }
  flag('showDeco', PR2.showDeco !== false);
  flag('showSeal', PR2.showSeal !== false);
  flag('showBrowserChrome', PR2.showBrowserChrome !== false);
  flag('showFooter', PR2.showFooter !== false);
  flag('showCaptions', PR2.showCaptions !== false);
  /* 描边三档：none / hair / paper（旧数据里是布尔值，true 按 hair 处理） */
  var egRaw = String(PR2.edgeGroup == null ? (PR2.shotBorder == null ? 'def' : PR2.shotBorder) : PR2.edgeGroup);
  var BORDERS = ['none','line','mat','glass'];
  var bdMode = egRaw === 'def' ? 'none'
             : (BORDERS.indexOf(egRaw) >= 0 ? egRaw
             : (egRaw === 'true' ? 'mat' : (egRaw === 'false' ? 'none'
             : (egRaw === 'thin' || egRaw === 'hair0' ? 'line'
             : (egRaw === 'hair' || egRaw === 'hair2' || egRaw === 'paper' ? 'mat' : 'none')))));
  html.setAttribute('data-param-shot-border', bdMode);
  document.documentElement.style.setProperty('--bdw', clampN(pnum('borderWidth', 4), 2, 14) + 'px');
  /* 边缘色：留空则自动 —— 沿用封签的做法，取主题强调色做低透明度玻璃，
     浅色主题偏暖白、深色主题偏冷白，但都带一点主题的色相，不是纯灰白 */
  var bdManual = String(PR2.borderColor || '').trim();
  var bdAuto;
  if(bdMode === 'glass'){
    bdAuto = fade(P.accent, isDark ? 0.26 : 0.20);
  } else if(bdMode === 'line'){
    bdAuto = isDark ? 'rgba(255,255,255,.14)' : mix(P.ink, '#000000', 0.10);
  } else {
    bdAuto = isDark ? mix(P.accent, '#ffffff', 0.06) : mix(P.accent, '#ffffff', 0.94);
  }
  document.documentElement.style.setProperty('--bd', bdManual || bdAuto);
  /* 自定义边缘：宽度 / 玻璃通透度 / 玻璃高光 / 投影柔度（关掉就用调好的默认） */
  var ceOn = toBoolP(PR2.customEdge, false);
  var gop = ceOn ? clampN(pnum('glassOpacity', 20), 6, 60) / 100 : 0.20;
  var gsh = ceOn ? clampN(pnum('glassSheen', 55), 0, 100) / 100 : 0.55;
  var sft = ceOn ? clampN(pnum('shadowSoft', 18), 0, 40) : 18;
  document.documentElement.style.setProperty('--gop', gop.toFixed(3));
  document.documentElement.style.setProperty('--gsheen', gsh.toFixed(3));
  document.documentElement.style.setProperty('--shsoft', sft + 'px');
  flag('cardReflect', PR2.cardReflect === true || PR2.cardReflect === 'true');

  /* ---------- 水印与质感 ---------- */
  applyWatermark(payload, P, isDark);
  applyMask(payload);

  /* ---------- 卡片投影强度 ---------- */
  var shRaw = Number(PR2.cardShadow);
  var sh = isFinite(shRaw) ? clampN(shRaw, 0, 100) / 100 : 0.55;
  document.documentElement.style.setProperty('--card-sh', sh.toFixed(3));

  /* ---------- 封签（原样） ---------- */
  var st = sealStyle(P, P.deskBase || paper);
  var seal = document.getElementById('seal');
  seal.style.setProperty('--sealBg', st.bg);
  seal.style.setProperty('--sealWho', st.who);
  seal.style.setProperty('--sealNote', st.note);
  var whoEl = document.getElementById('sealWho');
  var whoTxt = P.sharer || 'Reeden';
  var idxText = String(whoTxt).replace(/\s+/g, ' ') || 'Reeden';

  function graphemes(str){
    try{
      if(typeof Intl !== 'undefined' && Intl.Segmenter){
        var seg = new Intl.Segmenter('zh', { granularity:'grapheme' });
        var out = []; var it = seg.segment(str);
        for(var s of it){ out.push(s.segment); }
        return out;
      }
    }catch(e){}
    return Array.from(String(str));
  }
  var glyphs = graphemes(idxText);

  function codeFlags(str){
    var hasSymbol = false, hasText = false;
    for(var i = 0; i < str.length; i++){
      var c = str.charCodeAt(i);
      var isSym =
        (c >= 0x2600 && c <= 0x27BF) ||
        (c >= 0x2B00 && c <= 0x2BFF) ||
        (c >= 0x1F000 && c <= 0x1FAFF) ||
        (c >= 0xD800 && c <= 0xDFFF) ||
        c === 0xFE0F || c === 0x20E3;
      var isRTL =
        (c >= 0x0590 && c <= 0x08FF) ||
        (c >= 0x0900 && c <= 0x0EFF);
      if(isSym || isRTL) hasSymbol = true;
      else if(c > 0x20) hasText = true;
    }
    return { sym:hasSymbol, txt:hasText };
  }
  var cf = codeFlags(idxText);
  var horizontal = cf.sym && !cf.txt;
  var PER_CHAR = 1.12;

  var sealEl = document.getElementById('seal');
  var posterEl = document.getElementById('poster');
  var hdEl = document.querySelector('.hd');
  var room = 300;
  if(sealEl && posterEl && hdEl){
    var pb = posterEl.getBoundingClientRect().bottom;
    var sealBottom = pb - 46;
    var limit = hdEl.getBoundingClientRect().bottom + 10;
    room = Math.max(80, Math.round(sealBottom - limit));
  }
  var AVAIL = Math.max(60, room - 42);
  if(sealEl) sealEl.style.setProperty('--sealMax', room + 'px');

  var RESERVE = Math.min(room, 200);
  var size = Math.min(8.4, RESERVE / (PER_CHAR * glyphs.length));
  size = Math.max(5.6, Math.round(size * 10) / 10);

  whoEl.textContent = idxText;
  whoEl.style.fontSize = size + 'px';
  if(horizontal){
    whoEl.setAttribute('data-h', '1');
    whoEl.innerHTML = '';
    glyphs.forEach(function(g){
      var cell = document.createElement('i');
      cell.textContent = g;
      whoEl.appendChild(cell);
    });
  } else {
    whoEl.removeAttribute('data-h');
    whoEl.textContent = idxText;
  }
}

/* ============================================================
   水印与质感
   ============================================================ */
function escXml(str){
  return String(str == null ? '' : str).replace(/[<>&'"]/g, function(c){
    return {'<':'&lt;','>':'&gt;','&':'&amp;',"'":'&apos;','"':'&quot;'}[c];
  });
}

/* 斜向平铺水印：用 SVG 拼一块贴片，background-repeat 铺满整页。
   比逐字摆 DOM 轻得多，而且缩放时文字不会糊。 */
function wmPattern(text, color, opacity, fontStack, fontFace){
  var t = escXml(text || '');
  var fs = 9;
  var w = 210, h = 64;
  var ff = fontStack || '-apple-system,PingFang SC,sans-serif';
  var faceRule = '';
  if(fontFace && fontFace.data && fontFace.data.indexOf('data:') === 0){
    ff = fontFace.family;
    faceRule = '<style>@font-face{font-family:"' + fontFace.family + '";src:url("' + fontFace.data + '");}</style>';
  }
  var svg =
    '<svg xmlns="http://www.w3.org/2000/svg" width="' + w + '" height="' + h + '">' +
      faceRule +
      '<g transform="rotate(-24 ' + (w/2) + ' ' + (h/2) + ')" ' +
        'font-family="' + escXml(ff) + '" font-size="' + fs + '" ' +
        'font-weight="600" letter-spacing="1.6" fill="' + color + '" fill-opacity="' + opacity + '">' +
        '<text x="4" y="' + (h*0.34) + '">' + t + '</text>' +
        '<text x="' + (-w*0.36) + '" y="' + (h*0.84) + '">' + t + '</text>' +
      '</g>' +
    '</svg>';
  // SVG 里不要用 # 开头颜色（会被当成 fragment）；也不要 url("...") 包引号 ——
  // WebKit 对引号内 data URI 解析不稳。单引号 + 整体编码最稳。
  return {
    url: "url('data:image/svg+xml," + encodeURIComponent(svg) + "')",
    size: w + 'px ' + h + 'px'
  };
}

/* 水印字体：四档，不用让用户填字体名 */
function wmFontStack(mode, P){
  /* 中文优先，再兜底西文族名；移动端只有系统里装了的才会命中 */
  if(mode === 'kai')   return '"Kaiti SC","STKaiti","KaiTi","楷体","Kaiti TC",serif';
  if(mode === 'song')  return '"Songti SC","STSong","SimSun","Noto Serif CJK SC","Source Han Serif SC",serif';
  if(mode === 'hei')   return '"PingFang SC","Heiti SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif';
  if(mode === 'yuan')  return '"Yuanti SC","YouYuan","HYQiHei","Hiragino Maru Gothic ProN",sans-serif';
  if(mode === 'serif') return 'Georgia,"Songti SC","Times New Roman",serif';
  if(mode === 'mono')  return '"SF Mono","IBM Plex Mono",Menlo,monospace';
  if(mode === 'sans')  return '-apple-system,"PingFang SC",Helvetica,sans-serif';
  // auto：跟随模板标题字体
  var f = (P && P.font) ? P.font : '';
  return f ? ('"' + f + '",Georgia,"Songti SC",serif') : 'Georgia,"Songti SC",serif';
}

/* 水印开关：新参数是 select（off/on），旧数据是 switch（布尔），两种都认 */
function wmEnabled(PR){
  if(!PR) return false;
  var v = PR.watermark;
  if(v === 'on' || v === true) return true;
  if(v === 'off' || v === false) return false;
  return toBoolP(PR.enableWatermark, false);
}

function applyWatermark(payload, P, isDark){
  var PR = (payload && payload.params) || {};
  var el = document.getElementById('wm');
  if(!el) return;

  var on = wmEnabled(PR);
  el.style.display = on ? '' : 'none';
  // Use standard background properties instead of a CSS custom property:
  // Chromium/WebKit silently reject setProperty() on --wm-image once the value
  // passes a few MB (a large embedded watermark font makes the SVG data URI
  // huge), leaving the previous image behind. Direct style properties accept
  // large data URIs, so replacing the value always takes effect.
  if(!on){ el.style.backgroundImage=''; el.style.backgroundSize=''; return; }

  /* 默认文字：主题名 @分享者
     注意取的是「分享者」(profile.nickname)，不是主题作者(theme.author) */
  var custom = String(PR.watermarkText || '').trim();
  var who = '';
  if(custom){
    who = custom;
  } else {
    var tName = String(P.name || '').trim();
    var sharer = String(P.sharer || '').trim();
    if(tName && sharer) who = tName + ' @' + sharer;
    else if(sharer) who = '@' + sharer;
    else who = tName || 'Reeden';
  }

  var opRaw = Number(PR.watermarkOpacity);
  var op = isFinite(opRaw) ? clampN(opRaw, 4, 40) / 100 : 0.12;

  var fontMode = String(PR.watermarkFont || 'auto');
  var stack = wmFontStack(fontMode, P);
  /* 自定义水印字体：SVG 水印是隔离文档，读不到页面 @font-face，
     因此把字体 data URL 直接内嵌进 SVG；「跟随模板标题」对自定义标题字体同样生效。 */
  var fontFace = null;
  var wmFontData = String(PR.watermarkFontFile || '').trim();
  if(wmFontData.indexOf('data:') === 0){
    fontFace = { family: 'LiubaiWmCustom', data: wmFontData };
  } else if(fontMode === 'auto'){
    var titleData = String(PR.titleFont || '').trim();
    if(titleData.indexOf('data:') === 0) fontFace = { family: 'LiubaiWmCustom', data: titleData };
  }

  /* 图片水印优先：上传的图片平铺整页，浓度用 CSS opacity 表达 */
  var imgData = String(PR.watermarkImage || '').trim();
  if(imgData && imgData.indexOf('data:image/') === 0){
    var scaleRaw = Number(PR.watermarkImageScale);
    var pct = isFinite(scaleRaw) ? clampN(scaleRaw, 20, 300) : 100;
    var tile = Math.round(210 * pct / 100);
    el.style.backgroundImage = "url('" + imgData + "')";
    el.style.backgroundSize = tile + 'px auto';
    el.style.opacity = op.toFixed(3);
    return;
  }
  el.style.opacity = '';
  var pat = wmPattern(who, isDark ? '#FFFFFF' : '#000000', op.toFixed(3), stack, fontFace);
  el.style.backgroundImage = pat.url;
  el.style.backgroundSize = pat.size;
}

/* 截图质感：一个强度值自动映射到 模糊 / 纹理密度 / 叠加强度，
   用户不需要分别理解四个滑块在干什么。 */
function applyMask(payload){
  var PR = (payload && payload.params) || {};
  var style = String(PR.maskStyle || 'none');
  var VALID = {frost:1, halftone:1, engrave:1, linen:1, grain:1, stipple:1, crosshatch:1};
  if(!VALID[style]) style = 'none';

  var kRaw = Number(PR.maskStrength);
  var k = isFinite(kRaw) ? clampN(kRaw, 0, 100) / 100 : 0.45;

  var root = document.documentElement;
  root.setAttribute('data-param-mask-style', style);
  if(style === 'none') return;

  if(style === 'frost'){
    // 只柔化：0→0.6px，100→6px
    root.style.setProperty('--mask-blur', (0.6 + k * 5.4).toFixed(2) + 'px');

  } else if(style === 'halftone'){
    root.style.setProperty('--mask-blur', (0.2 + k * 0.9).toFixed(2) + 'px');
    root.style.setProperty('--mask-cell', (2.2 + (1 - k) * 2.2).toFixed(2) + 'px');
    root.style.setProperty('--mask-op', (0.16 + k * 0.62).toFixed(3));

  } else if(style === 'engrave'){
    root.style.setProperty('--mask-blur', (0.3 + k * 1.1).toFixed(2) + 'px');
    root.style.setProperty('--mask-gap', (3.6 - k * 1.4).toFixed(2) + 'px');
    root.style.setProperty('--mask-op', (0.14 + k * 0.60).toFixed(3));

  } else if(style === 'linen'){
    // 布纹：线距随强度收紧，叠加加深
    root.style.setProperty('--mask-blur', (0.3 + k * 0.9).toFixed(2) + 'px');
    root.style.setProperty('--mask-gap', (4.2 - k * 1.6).toFixed(2) + 'px');
    root.style.setProperty('--mask-op', (0.14 + k * 0.54).toFixed(3));

  } else if(style === 'grain'){
    // 颗粒：噪点贴片 + overlay，强度越高颗粒越明显
    root.style.setProperty('--mask-blur', (0.15 + k * 0.7).toFixed(2) + 'px');
    root.style.setProperty('--mask-cell', (170 - k * 70).toFixed(0) + 'px');
    root.style.setProperty('--mask-op', (0.12 + k * 0.42).toFixed(3));
    root.style.setProperty('--mask-noise', grainNoiseUrl());

  } else if(style === 'stipple'){
    // 点刻：点距收紧 + 叠加加深
    root.style.setProperty('--mask-blur', (0.3 + k * 0.9).toFixed(2) + 'px');
    root.style.setProperty('--mask-cell', (7.5 - k * 3.0).toFixed(2) + 'px');
    root.style.setProperty('--mask-op', (0.16 + k * 0.52).toFixed(3));

  } else {
    // crosshatch：排线间距收紧
    root.style.setProperty('--mask-blur', (0.2 + k * 0.9).toFixed(2) + 'px');
    root.style.setProperty('--mask-gap', (5.2 - k * 2.2).toFixed(2) + 'px');
    root.style.setProperty('--mask-op', (0.14 + k * 0.54).toFixed(3));
  }
}

/* 胶片颗粒：用 feTurbulence 生成一张噪点贴片，比叠多层径向渐变更像真噪点。
   只生成一次，缓存在变量里，重渲染不重复构造。 */
var __grainUrl = null;
function grainNoiseUrl(){
  if(__grainUrl) return __grainUrl;
  var svg =
    '<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160">' +
      '<filter id="n">' +
        '<feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>' +
        '<feColorMatrix type="saturate" values="0"/>' +
      '</filter>' +
      '<rect width="160" height="160" filter="url(#n)" opacity="0.9"/>' +
    '</svg>';
  __grainUrl = "url('data:image/svg+xml," + encodeURIComponent(svg) + "')";
  return __grainUrl;
}

/* ============================================================
   对外接口
   ============================================================ */
window.ReedenShareTemplate = {
  render: function(payload){
    try{ render(payload); }
    catch(e){
      var p = document.getElementById('poster');
      if(p && !p.textContent.trim()) p.textContent = '主题预览';
    }
  },
  seekAnimation: seekAnimation
};

window.Reeden = window.Reeden || {};
window.Reeden.seekAnimation = seekAnimation;
window.Reeden.render = window.ReedenShareTemplate.render;

var __payload = window.__REEDEN_SHARE_PAYLOAD__ || window.__REEDEN_MOCK__ || {};
if(document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', function(){ window.ReedenShareTemplate.render(__payload); });
} else {
  window.ReedenShareTemplate.render(__payload);
}

/* ready 信号：选择器改为 .trio img，兼顾静态/3D */
(function(){
  var fired = false;
  var send = function(){
    if(fired) return;
    fired = true;
    document.documentElement.setAttribute('data-reeden-ready','1');
  };
  var imgs = [].slice.call(document.querySelectorAll('.trio img'));
  var pending = imgs.length;
  if(!pending){ send(); }
  else {
    imgs.forEach(function(im){
      var done = function(){
        pending--;
        if(pending <= 0) send();
      };
      if(im.complete && im.naturalWidth > 0) done();
      else{
        im.addEventListener('load', done, { once:true });
        im.addEventListener('error', done, { once:true });
      }
    });
    setTimeout(send, 2500);
  }
})();
})();
</script>
