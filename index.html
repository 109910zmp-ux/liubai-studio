    <script>
      // Apply the saved UI theme before React mounts to avoid a light-theme flash.
      (function () {
        try {
          var saved = localStorage.getItem("liubai-ui-theme") || "system"
          var dark = saved === "dark" || (saved === "system" && matchMedia("(prefers-color-scheme: dark)").matches)
          document.documentElement.classList.toggle("dark", dark)
          document.querySelector('meta[name="theme-color"]').setAttribute("content", dark ? "#0a0a0a" : "#ffffff")
        } catch (error) {}
      })()
    </script>
    <title>留白 · Screenshot Studio</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
