    <script>
      // Apply the saved UI theme before React mounts to avoid a light-theme flash.
      (function () {
        try {
          var saved = localStorage.getItem("liubai-ui-theme") || "system"
          var dark = saved === "dark" || (saved === "system" && matchMedia("(prefers-color-scheme: dark)").matches)
          document.documentElement.classList.toggle("dark", dark)
          document.querySelector('meta[name="theme-color"]').setAttribute("content", dark ? "#0a0a0a" : "#ffffff")
        } catch (error) {}
      })()
    </script>

,"撤销 (Ctrl/Cmd+Z)":"Undo (Ctrl/Cmd+Z)","重做 (Ctrl/Cmd+Shift+Z)":"Redo (Ctrl/Cmd+Shift+Z)","先选择一套模板。":"Select a template first.","当前没有可用参数。":"No parameters available.",项目文件:"Project file","项目文件包含素材、模板、参数与配色，可完整恢复。":"A project file contains assets, layout, parameters and colors, and restores them all.",保存项目文件:"Save project file",载入项目文件:"Load project file",清空草稿:"Clear draft",全部重置:"Reset all","确认全部重置？":"Confirm reset all?","恢复所有设置到初始状态（可用撤销恢复）":"Restore all settings to their defaults (can be undone)","编辑后会自动存到本机浏览器，刷新页面可继续；「全部重置」会清空素材、参数、配色与草稿，恢复到初始状态（可用撤销找回）。":"Changes are saved locally and restored after refresh. Reset all clears assets, parameters, colors and the draft; you can still undo.","从素材到导出，几步完成一份截图作品。":"From screenshots to export, finish a share-worthy poster in a few steps.","1 · 快速开始":"1 · Quick start","2 · 预览操作":"2 · Preview controls","3 · 编辑与恢复":"3 · Editing & recovery","4 · 导出":"4 · Export","在「素材」拖入或选择截图；导入素材不会改动你已有的配色。":"Drop or choose screenshots in Assets. Importing never changes your palette.","在「排版模板」挑选版式，素材数量变化时会自动切换到能容纳的模板。":"Pick a layout in Layouts. When the asset count changes, a fitting template is selected automatically.","用「模板参数」「配色」调整视觉；纸面明暗在配色面板的「纸面」小节，参数面板支持搜索与分组折叠，开启「启用 3D 展映」可让截图卡片错落立体展示。":"Fine-tune with Parameters and Colors. Paper tone lives in the Colors panel. Parameters support search and collapsible groups. Enable 3D showcase for a staggered card display.","点顶栏「导出」，选择 PNG、视频或批量 ZIP。":"Click Export in the top bar to output PNG, video or a batch ZIP.","在主预览上滚动滚轮缩放，按住预览区拖拽可自由移动画布位置。":"Scroll over the main preview to zoom; drag the canvas to reposition it.","点「适应窗口」会同时重置缩放比例和画布位置。":"Fit to window resets both zoom and canvas position.","点预览栏的悬浮按钮可打开独立预览：拖标题栏移动、拖右下角调整窗口大小、滚轮缩放，还能最小化或全屏。":"Open the floating preview from the preview bar: drag its title bar, resize from the bottom-right corner, scroll to zoom, minimize or go fullscreen.","撤销 / 重做按钮，或按 Ctrl/Cmd+Z、Ctrl/Cmd+Shift+Z（也可按 Ctrl+Y）。":"Use Undo / Redo, or press Ctrl/Cmd+Z, Ctrl/Cmd+Shift+Z (Ctrl+Y also works).","点击色块可改色，色值直接以大写 HEX 显示；「从图片取色」需要手动触发。":"Click a swatch to edit it. HEX values are shown in uppercase. Extract colors runs only when you trigger it.","「模板参数」可上传本地字体（.ttf/.otf/.woff，大小不限）：标题字体在「图文排版」组，水印字体在「水印与质感」组开启水印后上传，导出同样生效。":"Parameters accept local fonts (.ttf/.otf/.woff, any size): title font under Typography; watermark font under Watermark & texture after enabling the watermark. Exports use them too.","开启水印后可放图片水印并调大小；水印字体留空时，自动跟随自定义标题字体。":"Once the watermark is on, you can add an image watermark and resize it. Leaving the watermark font empty follows the custom title font.","编辑内容会自动存为本机草稿，刷新后可继续；项目对话框可保存或载入 JSON 项目文件，也可「全部重置」到初始状态。":"Edits are saved as a local draft and restored on refresh. The Project dialog saves/loads JSON files and can reset everything.","顶栏主题按钮在浅色 / 深色 / 跟随系统之间循环切换，选择会被记住；偏好设置不影响海报自身配色。":"The top-bar theme button cycles Light / Dark / System and remembers your choice. Preferences do not change the poster palette.","PNG 可设置输出宽度；视频可设置时长、帧率与清晰度。":"PNG width is adjustable; video duration, frame rate and quality are configurable.","批量 ZIP 可选「仅 PNG」「仅视频」或「图片 + 视频」，按模板容量自动分组打包。":"Batch ZIP supports Images only, Video only, or Images + video, grouped by template capacity.","视频导出会临时启用模板的 3D 时间轴，完成后自动恢复你的原始预览参数。":"Video export temporarily enables the template timeline, then restores your original preview parameters.","视频优先用 WebCodecs 逐帧编码为 MP4（更快），失败时自动改用浏览器录制；回退时请保持页面在前台。iOS / iPadOS 需 Safari 16.4+，不支持时面板会给出提示，PNG 与批量 ZIP 不受影响。":"Video prefers WebCodecs frame-by-frame MP4 encoding (faster). If unavailable, it falls back to browser recording—keep the page in the foreground. iOS / iPadOS need Safari 16.4+; PNG and batch ZIP are unaffected.","开启 3D 展映后导出的 PNG 同样会保留全部素材，无需担心图片丢失。":"PNGs exported with 3D showcase keep every asset; no images are dropped.","按 Esc 可关闭弹窗或颜色选择器；导出的 PNG 可直接在 iOS / iPadOS 分享与保存。":"Press Esc to close dialogs or the color picker. Exported PNGs can be shared or saved on iOS / iPadOS.",主题名字:"The <title>__REEDEN_TITLE__</title>\r
<style>\r
*{box-sizing:border-box;margin:0;padding:0}\r
html,body{margin:0;padding:0;background:transparent}\r
body{width:640px;min-height:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;-webkit-font-smoothing:antialiased}\r
\r
/* ============================================================\r
   以下 CSS 完全沿用你原「六图终版」，逐字保留\r
   ============================================================ */\r
#deskBg{position:absolute;inset:0;z-index:0;pointer-events:none;opacity:0;transition:opacity .25s ease;background-size:cover;background-position:center;background-repeat:no-repeat}\r
#deskTint{position:absolute;inset:0;z-index:0;pointer-events:none;opacity:0;transition:opacity .25s ease;background:var(--tintPaper)}\r
.poster.has-bg #deskBg{opacity:1}\r
.poster.has-bg:not(.is-plain) #deskTint{opacity:1}\r
\r
.poster{\r
  width:640px;max-width:640px;margin:0 auto;padding:0;\r
  position:relative;overflow:hidden;\r
  border-radius:var(--poster-r,10px);background:transparent;\r
  font-family:var(--sans);\r
  -webkit-font-smoothing:antialiased;\r
  --chrome:#fff;\r
  --topbar:linear-gradient(#F6F6F6,#EEEEEE);\r
  --chromeLine:#E2E2E2;\r
  --chromeBtn:#FFF;\r
  --chromeMute:#9C9C98;\r
  --chromeInk:#3C3C38;\r
  --shotBg:#FFF;\r
  --sealLine:rgba(255,255,255,.62);\r
  --sealHi:rgba(255,255,255,.66);\r
  --glassHi:rgba(255,255,255,.72);\r
  --glassLo:rgba(255,255,255,.10);\r
}\r
.poster.is-dark{\r
  --chrome:#1E1F22;--topbar:#26282C;--chromeLine:#34373C;--chromeBtn:#2E3136;\r
  --chromeMute:#8E8A84;--chromeInk:#D5CFC6;--shotBg:#1A1B1E;\r
  --sealLine:rgba(255,255,255,.16);--sealHi:rgba(255,255,255,.14);\r
}\r
.win{position:relative;z-index:1;background:var(--chrome);border-radius:var(--poster-r,10px);overflow:hidden;isolation:isolate;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}\r
.top{display:flex;align-items:center;gap:9px;padding:0 13px;height:42px;position:relative;z-index:3;background:var(--topbar);border-bottom:1px solid var(--chromeLine)}\r
.lights{display:flex;gap:5.5px;flex-shrink:0}\r
.lights i{width:9px;height:9px;border-radius:50%;display:block}\r
.lights i:nth-child(1){background:#F2604C}\r
.lights i:nth-child(2){background:#F5BE3D}\r
.lights i:nth-child(3){background:#4FC22F}\r
.nav{display:flex;gap:4px;flex-shrink:0}\r
.nav b{width:21px;height:21px;border-radius:50%;background:var(--chromeBtn);border:1px solid var(--chromeLine);display:flex;align-items:center;justify-content:center}\r
.nav b svg{width:7px;height:7px;stroke:#8C8C8C;stroke-width:2.2;fill:none}\r
.spacer{width:2px;flex-shrink:0}\r
.urlbox{flex:1;min-width:0;height:26px;border-radius:5px;background:var(--chromeBtn);border:1px solid var(--chromeLine);display:flex;align-items:center;justify-content:center;gap:5px;padding:0 8px}\r
.urlbox .mode{flex:none;width:7.2pt;height:7.2pt;display:block}\r
.urlbox .mode svg{width:100%;height:100%;display:block;stroke:#8C8C8C;stroke-width:1.5;fill:none}\r
.urlbox .host{font-family:var(--mono);font-size:8.6px;letter-spacing:.02em;color:var(--chromeMute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\r
.urlbox .host em{font-style:normal;color:var(--chromeInk)}.urlbox .urlby{opacity:.55;font-size:9px}\r
.acts{display:flex;gap:7px;flex-shrink:0;align-items:center}\r
.acts svg{width:12px;height:12px;stroke:#8C8C8C;stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round}\r
\r
.page{position:relative;padding:20px 42px 16px 42px;background:var(--paper,#fff)}\r
.deco{position:absolute;inset:0;z-index:1;pointer-events:none;line-height:0;overflow:hidden}\r
.poster.has-bg .deco{opacity:.55}\r
.deco svg{display:block;width:100%;height:100%}\r
.hd{position:relative;z-index:2;display:flex;align-items:flex-start;justify-content:space-between;gap:12px}\r
.name{font-family:var(--title);font-size:26px;line-height:1.22;font-weight:600;letter-spacing:.005em;color:var(--ink);max-width:100%;word-break:break-word}\r
.name .maker{display:block;font-family:var(--mono);font-size:10.6px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin-bottom:9px;line-height:1.25}\r
.name .maker[data-cjk="1"]{font-family:var(--title);font-weight:500;letter-spacing:.08em;text-transform:none;font-size:11px}\r
.intro{position:relative;z-index:2;margin-top:7px;font-family:var(--title);font-size:11.8px;line-height:1.62;color:var(--mute);max-width:100%;white-space:normal;word-break:break-word}\r
\r
/* 静态网格 */\r
.trio{\r
  position:relative;z-index:2;\r
  display:grid;\r
  grid-template-columns:repeat(var(--cols,3), 1fr);\r
  justify-items:center;align-items:start;\r
  column-gap:12px;row-gap:24px;margin-top:19px;\r
}\r
.shot{position:relative;line-height:0;border-radius:var(--shot-r,4px);overflow:hidden;background:var(--shotBg);box-shadow:0 1px 1px rgba(0,0,0,.05),0 8px 18px -7px rgba(0,0,0,.26);outline:1px solid rgba(0,0,0,.055);outline-offset:-1px}\r
.shot img{width:100%;height:100%;object-fit:contain;display:block}\r
/* 截图边缘：默认「无」，只有投影。\r
   命名按「加的是什么」而不是按颜色：\r
   line = 一条线；mat = 一圈卡纸（会把画面撑开）；glass = 一圈磨砂玻璃（取封签的质感） */\r
html[data-param-shot-border="none"] .shot{padding:0;background:none}\r
/* 投影：强度与柔度两者都由变量控制，边缘档位只叠加自己的内描边 */\r
html body .shot, html body .trio.is-3d .card3d, html body .poster.is-dark .trio.is-3d .card3d{box-shadow:0 calc(4px + var(--shsoft,18px) * .35) calc(10px + var(--shsoft,18px)) rgba(0,0,0,calc(var(--card-sh,.55) * .46))}\r
html[data-param-shot-border="line"] .shot{padding:0;background:none;box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--bd,#1a1a1a) 26%, transparent)}\r
html[data-param-shot-border="mat"] .shot{padding:var(--bdw,4px);background:var(--bd,#fff);box-shadow:0 0 0 1px color-mix(in srgb, var(--ink,#000) 7%, transparent)}\r
html[data-param-shot-border="mat"] .shot img{border-radius:calc(var(--shot-r,4px) - 1px)}\r
/* 磨砂玻璃：与封签同一套语汇 —— 通透度 / 高光都由「自定义」控制 */\r
html[data-param-shot-border="glass"] .shot{\r
  padding:var(--bdw,4px);\r
  background:linear-gradient(155deg, color-mix(in srgb, var(--bd,#fff) calc(var(--gop,.20) * 170%), transparent) 0%, color-mix(in srgb, var(--bd,#fff) calc(var(--gop,.20) * 60%), transparent) 62%, color-mix(in srgb, var(--bd,#fff) calc(var(--gop,.20) * 120%), transparent) 100%);\r
  border:1px solid color-mix(in srgb, var(--bd,#fff) calc(var(--gop,.20) * 275%), transparent);\r
  box-shadow:inset 0 1px 0 rgba(255,255,255,var(--gsheen,.55)),0 1px 2px rgba(0,0,0,.06);\r
}\r
html[data-param-shot-border="glass"] .shot img{border-radius:calc(var(--shot-r,4px) - 2px)}\r
\r
/* 3D 卡片沿用同一套「图片样式」—— 静态网格什么样，3D 里就什么样 */\r
.trio.is-3d .card3d{overflow:visible}\r
html[data-param-shot-border="none"] .trio.is-3d .card3d{padding:0;background:none}\r
html[data-param-shot-border="line"] .trio.is-3d .card3d{padding:0;background:none;box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--bd,#1a1a1a) 26%, transparent),0 calc(4px + var(--shsoft,18px) * .35) calc(10px + var(--shsoft,18px)) rgba(0,0,0,calc(var(--card-sh,.55) * .46))}\r
html[data-param-shot-border="mat"] .trio.is-3d .card3d{padding:var(--bdw,4px);background:var(--bd,#fff);box-shadow:0 0 0 1px color-mix(in srgb, var(--ink,#000) 7%, transparent),0 calc(4px + var(--shsoft,18px) * .35) calc(10px + var(--shsoft,18px)) rgba(0,0,0,calc(var(--card-sh,.55) * .46))}\r
html[data-param-shot-border="mat"] .trio.is-3d .card3d img{border-radius:calc(var(--shot-r,4px) - 1px)}\r
html[data-param-shot-border="glass"] .trio.is-3d .card3d{\r
  padding:var(--bdw,4px);\r
  background:linear-gradient(155deg, color-mix(in srgb, var(--bd,#fff) calc(var(--gop,.2) * 170%), transparent) 0%, color-mix(in srgb, var(--bd,#fff) calc(var(--gop,.2) * 60%), transparent) 62%, color-mix(in srgb, var(--bd,#fff) calc(var(--gop,.2) * 120%), transparent) 100%);\r
  border:1px solid color-mix(in srgb, var(--bd,#fff) calc(var(--gop,.2) * 275%), transparent);\r
  box-shadow:inset 0 1px 0 rgba(255,255,255,var(--gsheen,.55)),0 calc(4px + var(--shsoft,18px) * .35) calc(10px + var(--shsoft,18px)) rgba(0,0,0,calc(var(--card-sh,.55) * .46));\r
}\r
html[data-param-shot-border="glass"] .trio.is-3d .card3d img{border-radius:calc(var(--shot-r,4px) - 2px)}\r
/* 卡框会占掉内边距，图要按内容盒铺满 */\r
html[data-param-shot-border="line"] .trio.is-3d .card3d,\r
html[data-param-shot-border="none"] .trio.is-3d .card3d,\r
html[data-param-shot-border="mat"] .trio.is-3d .card3d,\r
html[data-param-shot-border="glass"] .trio.is-3d .card3d{box-sizing:border-box}\r
html[data-param-shot-border="line"] .trio.is-3d .card3d img,\r
html[data-param-shot-border="none"] .trio.is-3d .card3d img,\r
html[data-param-shot-border="mat"] .trio.is-3d .card3d img,\r
html[data-param-shot-border="glass"] .trio.is-3d .card3d img{width:100%;height:100%}\r
html[data-param-shot-border="glass"] .shot::after{\r
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;\r
  background:linear-gradient(150deg, rgba(255,255,255,calc(var(--gsheen,.55) * .33)), rgba(255,255,255,0) 46%);\r
}\r
\r
/* 投影：强度 × 柔度，两档（0 强度时完全无影） */\r
.shot .empty{\r
  width:100%;height:100%;display:flex;flex-direction:column;\r
  align-items:center;justify-content:center;gap:5px;\r
  background:#FAFAF8;color:#C0C0BC;\r
  border:1px dashed rgba(0,0,0,.18);\r
  border-radius:inherit;\r
}\r
.shot .empty .empty-lbl{\r
  font-family:var(--title);font-size:12px;letter-spacing:.04em;\r
  color:var(--mute);opacity:.92;\r
}\r
.shot .empty .empty-sub{\r
  font-family:var(--mono);font-size:7.4px;letter-spacing:.14em;\r
  text-transform:uppercase;color:#A8A8A4;\r
}\r
.cap{display:flex;align-items:baseline;justify-content:center;gap:5px;margin-top:7px;font-family:var(--mono);font-size:7.4px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);white-space:nowrap;overflow:hidden}\r
.cap em{font-style:italic;font-family:var(--latin);font-size:13.6px;line-height:1;letter-spacing:.01em;color:var(--accent);text-transform:none}\r
.cap s{text-decoration:none;opacity:.72;letter-spacing:.06em}\r
.cap s b{font-weight:400;margin-left:3px;color:var(--accent);opacity:.95}\r
.cap[data-lang="zh"] s{font-family:var(--title)}\r
\r
.foot{position:relative;z-index:2;display:flex;align-items:baseline;justify-content:flex-end;gap:6px;margin-top:10px;padding-right:1px;font-family:var(--mono);color:var(--mute)}\r
.foot .cr{font-size:7.4px;letter-spacing:.04em;opacity:.55;margin-left:4px}\r
.foot .c{font-family:var(--latin);font-style:italic;font-size:8.2pt;line-height:1;color:var(--accent);opacity:.85}\r
.foot .a{font-family:var(--title);font-size:7.9pt;letter-spacing:.04em;color:var(--mute);opacity:.9;max-width:72%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\r
\r
.seal{position:absolute;right:0;bottom:46px;z-index:3;display:flex;flex-direction:column;align-items:center;gap:8px;padding:9px 4px 8px;width:max-content;max-width:34px;max-height:var(--sealMax,300px);overflow:hidden;background:var(--sealBg);border:1px solid var(--sealLine,rgba(255,255,255,.62));border-right:0;border-radius:5px 0 0 5px;box-shadow:inset 0 1px 0 var(--sealHi,rgba(255,255,255,.66)),-2px 2px 8px -2px rgba(0,0,0,.10);transform:rotate(-.4deg)}\r
.seal .who{writing-mode:vertical-rl;text-orientation:upright;font-family:var(--title);font-size:8.4px;letter-spacing:.12em;line-height:1.34;color:var(--sealWho);max-height:none;overflow:hidden}\r
.seal .who[data-h="1"]{writing-mode:horizontal-tb;text-orientation:mixed;letter-spacing:0;line-height:1.14;display:flex;flex-direction:column;align-items:center;gap:1px}\r
.seal .who[data-h="1"] i{display:block;font-style:normal;line-height:1}\r
.seal .who[data-clipped="1"]{-webkit-mask-image:linear-gradient(to bottom,#000 70%,rgba(0,0,0,.15) 100%);mask-image:linear-gradient(to bottom,#000 70%,rgba(0,0,0,.15) 100%)}\r
.seal .note{writing-mode:vertical-rl;font-family:"Hiragino Mincho ProN","Yu Mincho","Songti SC",serif;font-size:6.4px;letter-spacing:.26em;line-height:1;color:var(--sealNote);opacity:.88}\r
\r
@keyframes lightBreathe{0%,100%{filter:brightness(1)}50%{filter:brightness(1.28)}}\r
.lights i:nth-child(1){animation:lightBreathe 3.6s ease-in-out infinite}\r
.lights i:nth-child(2){animation:lightBreathe 3.6s ease-in-out infinite;animation-delay:-1.2s}\r
.lights i:nth-child(3){animation:lightBreathe 3.6s ease-in-out infinite;animation-delay:-2.4s}\r
@keyframes cursorBlink{0%,45%{opacity:1}55%,100%{opacity:.28}}\r
.urlbox{position:relative}\r
html .urlbox::after{display:none!important}\r
.urlbox .host{padding-right:6px}\r
@keyframes breathe{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.4px)}}\r
.name{animation:breathe 7s ease-in-out infinite}\r
.intro{animation:breathe 7s ease-in-out infinite;animation-delay:-4.8s}\r
@keyframes decoDrift{0%,100%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(0,-6px,0) scale(1.012)}}\r
.deco{transform-origin:50% 50%;animation:decoDrift 18s ease-in-out infinite}\r
@media (prefers-reduced-motion:reduce){.lights i,.urlbox::after,.name,.intro,.deco{animation:none}.urlbox::after{display:none}}\r
html[data-param-show-browser-chrome="false"] .top{display:none}\r
html[data-param-show-footer="false"] .foot{display:none}\r
html[data-param-show-captions="false"] .cap{display:none}\r
html[data-param-show-seal="false"] #seal{display:none}\r
\r
/* ============================================================\r
   ★ 新增：3D 展映舞台样式（只在 .trio.is-3d 时生效）\r
   ============================================================ */\r
.trio.is-3d{\r
  display:block;\r
  position:relative;\r
  margin-top:19px;\r
  height:480px;\r
  border-radius:12px;\r
  overflow:hidden;\r
  isolation:isolate;\r
  perspective:1100px;\r
  perspective-origin:50% 48%;\r
  background:linear-gradient(160deg, rgba(255,255,255,.03), rgba(255,255,255,.006));\r
  border:1px solid rgba(0,0,0,.06);\r
}\r
.poster.is-dark .trio.is-3d{\r
  background:linear-gradient(160deg, rgba(255,255,255,.04), rgba(255,255,255,.008));\r
  border-color:rgba(255,255,255,.06);\r
}\r
.trio.is-3d.no-3d{perspective:none}\r
.trio.is-3d .stage3d{\r
  position:absolute;inset:0;\r
  transform-style:preserve-3d;\r
  will-change:transform;\r
}\r
.trio.is-3d.no-3d .stage3d{transform-style:flat}\r
\r
/* 3D 卡片：完全交给 JS 算 transform，这里只管外观 */\r
.trio.is-3d .card3d{\r
  position:absolute;left:50%;top:50%;\r
  border-radius:var(--shot-r,4px);\r
  overflow:hidden;\r
  background:var(--shotBg);\r
  box-shadow:\r
    0 14px 32px -12px rgba(0,0,0,.55),\r
    0 0 0 1px rgba(0,0,0,.06);\r
  will-change:transform,opacity;\r
  backface-visibility:hidden;-webkit-backface-visibility:hidden;\r
  transform-origin:50% 50%;\r
  cursor:pointer;\r
  opacity:0;\r
}\r
.poster.is-dark .trio.is-3d .card3d{\r
  box-shadow:\r
    0 14px 32px -12px rgba(0,0,0,.85),\r
    0 0 0 1px rgba(255,255,255,.08);\r
}\r
.trio.is-3d .card3d img{\r
  display:block;width:100%;height:100%;\r
  object-fit:fill;object-position:center;\r
  pointer-events:none;-webkit-user-drag:none;user-select:none;\r
}\r
.trio.is-3d .card3d .empty{\r
  width:100%;height:100%;\r
  display:flex;align-items:center;justify-content:center;\r
  background:#FAFAF8;color:#C0C0BC;\r
  font-size:9.9px;letter-spacing:.08em;\r
}\r
\r
/* 图注条：浮在底部中央，毛玻璃徽章 */\r
/* ============================================================\r
   展签式图注：移出 3D 展台，落在纸面上（画廊展签）\r
   页码用罗马数字 + 总数，配合展台底边一道进度细线\r
   ============================================================ */\r
.capbar3d{\r
  position:relative;\r
  display:flex;align-items:baseline;justify-content:center;gap:10px;\r
  margin:11px 0 0;\r
  padding:0;\r
  width:100%;\r
  background:none;border:0;box-shadow:none;\r
  backdrop-filter:none;-webkit-backdrop-filter:none;\r
  color:var(--mute);\r
  font-family:var(--mono);\r
  white-space:nowrap;\r
  pointer-events:none;\r
}\r
.capbar3d .cap-num{\r
  font-style:italic;\r
  font-family:var(--latin);\r
  font-size:15px;line-height:1;\r
  color:var(--accent);\r
  letter-spacing:.01em;\r
}\r
.capbar3d .cap-num i{\r
  font-style:normal;\r
  font-family:var(--sans);\r
  font-size:8.2px;\r
  letter-spacing:.02em;\r
  color:var(--mute);\r
  opacity:.66;\r
  margin-left:1px;\r
  font-variant-numeric:tabular-nums;\r
}\r
.capbar3d .cap-name{\r
  font-size:8.6px;\r
  letter-spacing:.20em;\r
  text-transform:uppercase;\r
  color:var(--mute);\r
}\r
.capbar3d .cap-name b{\r
  font-weight:400;\r
  margin-left:5px;\r
  color:var(--accent);\r
  opacity:.72;\r
  text-transform:none;\r
  letter-spacing:.04em;\r
  font-size:10px;\r
  /* ☀/☾ 靠 U+FE0E 文本变体压成单色，这里再兜一层灰度 */\r
  filter:grayscale(1);\r
}\r
/* 展台底边：1px 进度细线，替代页码点 */\r
.trio.is-3d .cap-rule{\r
  position:absolute;left:0;right:0;bottom:0;\r
  height:1px;z-index:19;pointer-events:none;\r
  background:rgba(0,0,0,.07);\r
}\r
.poster.is-dark .trio.is-3d .cap-rule{background:rgba(255,255,255,.09)}\r
.trio.is-3d .cap-rule i{\r
  position:absolute;left:0;top:0;bottom:0;width:0;\r
  background:var(--accent);\r
  opacity:.62;\r
  transition:width .12s linear;\r
}\r
/* ============================================================\r
   卡片阴影：按布局给不同的影子，不是一套影子走天下\r
   ------------------------------------------------------------\r
   coverflow  两侧斜影，横向拉长 —— 强调「并排一排」\r
   ring 宽松  正下方柔圆影，范围小 —— 环有体积，影子不能抢\r
   ring 紧凑  极窄的贴地影 —— 卡片已经贴住，影子只是压边\r
   fan        下偏左的斜影 —— 扇形是绕圆心转，影子跟着偏\r
   stack      每层错位的小方影 —— 叠牌要看出厚度\r
   ============================================================ */\r
.trio.is-3d .card3d::before{\r
  content:"";\r
  position:absolute;\r
  pointer-events:none;\r
  z-index:-1;\r
  opacity:1;\r
  transition:opacity .2s ease, background .2s ease;\r
  /* 默认值 = coverflow 的斜影 */\r
  left:-6%;right:-6%;bottom:-11%;\r
  height:18%;\r
  border-radius:50%;\r
  filter:blur(6px);\r
  background:radial-gradient(ellipse at 50% 50%,\r
    rgba(0,0,0,calc(var(--card-sh,.55) * .92)) 0%,\r
    rgba(0,0,0,calc(var(--card-sh,.55) * .42)) 44%,\r
    rgba(0,0,0,0) 74%);\r
}\r
\r
/* coverflow：横向拉长的斜影，两侧更重 */\r
html[data-lay3d="coverflow"] .trio.is-3d .card3d::before{\r
  left:-14%;right:-14%;bottom:-10%;\r
  height:15%;\r
  filter:blur(7px);\r
}\r
\r
/* ring 宽松：正下方的小圆影 */\r
html[data-lay3d="ring"] .trio.is-3d .card3d::before{\r
  left:16%;right:16%;bottom:-8%;\r
  height:12%;\r
  filter:blur(8px);\r
  background:radial-gradient(ellipse at 50% 50%,\r
    rgba(0,0,0,calc(var(--card-sh,.55) * .78)) 0%,\r
    rgba(0,0,0,calc(var(--card-sh,.55) * .34)) 46%,\r
    rgba(0,0,0,0) 76%);\r
}\r
\r
/* ring 紧凑：极窄的贴地影，只压一条边 */\r
html[data-lay3d="ringFloat"] .trio.is-3d .card3d::before{\r
  left:4%;right:4%;bottom:-5%;\r
  height:7%;\r
  filter:blur(4px);\r
  background:radial-gradient(ellipse at 50% 50%,\r
    rgba(0,0,0,calc(var(--card-sh,.55) * .95)) 0%,\r
    rgba(0,0,0,calc(var(--card-sh,.55) * .5)) 40%,\r
    rgba(0,0,0,0) 70%);\r
}\r
\r
/* fan：下偏左的斜影 */\r
html[data-lay3d="fan"] .trio.is-3d .card3d::before{\r
  left:-10%;right:2%;bottom:-10%;\r
  height:16%;\r
  filter:blur(6px);\r
  background:radial-gradient(ellipse at 42% 50%,\r
    rgba(0,0,0,calc(var(--card-sh,.55) * .88)) 0%,\r
    rgba(0,0,0,calc(var(--card-sh,.55) * .4)) 44%,\r
    rgba(0,0,0,0) 74%);\r
}\r
\r
/* stack：每层错位的小方影，看得见厚度 */\r
html[data-lay3d="stack"] .trio.is-3d .card3d::before{\r
  left:6%;right:-4%;bottom:-7%;\r
  height:11%;\r
  border-radius:34%;\r
  filter:blur(5px);\r
  background:radial-gradient(ellipse at 46% 50%,\r
    rgba(0,0,0,calc(var(--card-sh,.55) * .82)) 0%,\r
    rgba(0,0,0,calc(var(--card-sh,.55) * .36)) 46%,\r
    rgba(0,0,0,0) 76%);\r
}\r
\r
.poster.is-dark .trio.is-3d .card3d::before{\r
  filter:blur(6px) brightness(1.6);\r
}\r
\r
/* 倒影：卡片下方一面垂直翻转、逐渐淡出的副本。\r
   用 ::after 叠 background-image 实现，不额外增加 DOM 节点。\r
   默认 content 为空 —— 开关关掉时这个伪元素根本不存在。 */\r
html[data-param-card-reflect="true"] .trio.is-3d .card3d::after{\r
  content:"";\r
  position:absolute;\r
  left:0;right:0;\r
  top:100%;\r
  height:62%;\r
  border-radius:var(--shot-r,4px);\r
  background-image:inherit;\r
  background-size:100% 100%;\r
  background-repeat:no-repeat;\r
  transform:scaleY(-1);\r
  transform-origin:50% 0;\r
  opacity:.26;\r
  pointer-events:none;\r
  -webkit-mask-image:linear-gradient(to bottom, rgba(0,0,0,.85), rgba(0,0,0,0) 78%);\r
  mask-image:linear-gradient(to bottom, rgba(0,0,0,.85), rgba(0,0,0,0) 78%);\r
  z-index:-2;\r
}\r
\r
/* ============================================================\r
   页码指标：按布局几何选一种，不并存\r
   ------------------------------------------------------------\r
   线性布局（coverflow / fan / stack）：用展台底边的进度线。\r
     它们是线性阵列，「连续位移」本身就是它的语言。\r
   环形布局（ring / ringFloat）：用环形刻度。\r
     环是循环的，线性进度条会误导 —— 它暗示有起点和终点。\r
   ============================================================ */\r
\r
/* ============================================================\r
   页码指标：两种，按布局密度选一种，不并存\r
   ------------------------------------------------------------\r
   ring（宽松）   → 展台底边的进度线。环大、卡片之间有空隙，\r
                    一条连续的线更贴「缓慢推进」的节奏。\r
   ringFloat（紧凑）→ 页码选择器。卡片贴成一块，需要离散的「格」，\r
                    而且要能点着跳。\r
   线性布局（coverflow / fan / stack）→ 页码选择器 + 进度线（原设计）\r
   ============================================================ */\r
\r
/* 页码选择器：n 个细横条 + 一个滑动的指示块。\r
   刻意不加阴影、不加毛玻璃 —— 它是纸面展签的一部分，不是浮层。 */\r
.pgsel{\r
  position:relative;\r
  display:flex;align-items:center;gap:6px;\r
  margin-left:5px;\r
  padding-left:13px;\r
  pointer-events:auto;\r
  flex:none;\r
}\r
.pgsel::before{\r
  content:"";position:absolute;left:0;top:50%;\r
  width:1px;height:9px;margin-top:-4.5px;\r
  background:currentColor;opacity:.18;\r
}\r
.pgsel .pg{\r
  width:6px;height:2px;padding:0;border:0;\r
  border-radius:1px;\r
  background:currentColor;opacity:.22;\r
  cursor:pointer;outline:none;\r
  flex:none;\r
  transition:opacity .28s ease;\r
}\r
.pgsel .pg:hover{opacity:.5}\r
/* 滑动的指示块：单独一个元素，靠 translateX + width 过渡 */\r
/* 当前页的那一条：自己变长、上强调色。\r
   不做独立滑块 —— 每个点管自己，不需要算坐标，也就不会错位。 */\r
.pgsel .pg.active{\r
  width:13px;\r
  background:var(--accent);\r
  opacity:1;\r
}\r
\r
/* 页码指标由参数决定，不再按布局硬编码 */\r
html[data-ind="line"] .pgsel{ display:none; }\r
html[data-ind="dots"] .cap-rule{ display:none; }\r
html[data-ind="none"] .pgsel{ display:none; }\r
html[data-ind="none"] .cap-rule{ display:none; }\r
html[data-cap-num="off"] .cap-num{ display:none; }\r
\r
/* 浮光式圆点：细点 + 当前页拉成短棒，底部一条毛玻璃药丸底托 */\r
.pgsel.is-float{\r
  margin-left:6px;padding:5px 11px 5px 11px;gap:7px;\r
  border-radius:999px;\r
  /* 底色用「纸色 + 强调色 一点点」，浅底和深底都不糊 */\r
  background:color-mix(in srgb, var(--paper,#fff) 72%, var(--accent) 8%);\r
  box-shadow:\r
    inset 0 0 0 1px color-mix(in srgb, var(--accent) 18%, transparent),\r
    0 2px 10px -6px rgba(0,0,0,.35);\r
  -webkit-backdrop-filter:blur(8px) saturate(1.05);\r
  backdrop-filter:blur(8px) saturate(1.05);\r
}\r
.pgsel.is-float::before{display:none}\r
.pgsel.is-float .pg{\r
  width:6px;height:6px;border-radius:50%;\r
  transition:width .35s cubic-bezier(.4,0,.2,1), background .35s ease, border-radius .35s ease;\r
}\r
.pgsel.is-float .pg{\r
  background:color-mix(in srgb, currentColor 38%, transparent);\r
}\r
.pgsel.is-float .pg.active{\r
  width:18px;border-radius:3px;\r
  background:var(--accent);opacity:1;\r
}\r
\r
html[data-param-show-captions="false"] .capbar3d{display:none}\r
html[data-param-show-captions="false"] .trio.is-3d .cap-rule{display:none}\r
\r
/* ============================================================\r
   水印层：挂在 .page 内，压在装饰层之上、封签之下\r
   ============================================================ */\r
.wm{\r
  position:absolute;inset:0;z-index:3;pointer-events:none;overflow:hidden;\r
  background-image:var(--wm-image,none);\r
  background-size:var(--wm-size,190px 62px);\r
  background-repeat:repeat;\r
}\r
\r
/* ============================================================\r
   截图质感：一层 filter + 一层纹理叠加，全 CSS，无 canvas\r
   每个风格只有「一个强度」在外面，内部各自映射到模糊/密度/叠加\r
   ============================================================ */\r
.shot, .card3d{position:relative}\r
.shot::after, .card3d::after{\r
  content:"";position:absolute;inset:0;z-index:6;\r
  pointer-events:none;border-radius:inherit;\r
  opacity:0;transition:opacity .2s ease;\r
}\r
.shot img, .card3d img{transition:filter .2s ease}\r
\r
/* 霜雾：只柔化，保住色调与构图 */\r
html[data-param-mask-style="frost"] .shot img,\r
html[data-param-mask-style="frost"] .card3d img{\r
  filter:blur(var(--mask-blur,2px)) saturate(.94);\r
}\r
\r
/* 网点印刷：能看出构图，认不出字 */\r
html[data-param-mask-style="halftone"] .shot img,\r
html[data-param-mask-style="halftone"] .card3d img{\r
  filter:blur(var(--mask-blur,0.4px)) contrast(1.05);\r
}\r
html[data-param-mask-style="halftone"] .shot::after,\r
html[data-param-mask-style="halftone"] .card3d::after{\r
  opacity:var(--mask-op,.45);\r
  background-image:radial-gradient(circle at 50% 50%, rgba(18,20,24,.62) 0 .9px, transparent 1.15px);\r
  background-size:var(--mask-cell,3px) var(--mask-cell,3px);\r
  mix-blend-mode:multiply;\r
}\r
\r
/* 银雕横纹：细横线压住文字，像旧印刷品的刻线 */\r
html[data-param-mask-style="engrave"] .shot img,\r
html[data-param-mask-style="engrave"] .card3d img{\r
  filter:blur(var(--mask-blur,0.6px)) grayscale(.3);\r
}\r
html[data-param-mask-style="engrave"] .shot::after,\r
html[data-param-mask-style="engrave"] .card3d::after{\r
  opacity:var(--mask-op,.42);\r
  background-image:repeating-linear-gradient(0deg, rgba(22,24,28,.52) 0 .65px, transparent .65px var(--mask-gap,2.6px));\r
  mix-blend-mode:multiply;\r
}\r
\r
/* 亚麻织纹：两个方向的细线交叉，像书页的布纹纸 */\r
html[data-param-mask-style="linen"] .shot img,\r
html[data-param-mask-style="linen"] .card3d img{\r
  filter:blur(var(--mask-blur,0.5px)) contrast(1.02);\r
}\r
html[data-param-mask-style="linen"] .shot::after,\r
html[data-param-mask-style="linen"] .card3d::after{\r
  opacity:var(--mask-op,.40);\r
  background-image:\r
    repeating-linear-gradient(90deg, rgba(24,26,30,.30) 0 .5px, transparent .5px var(--mask-gap,3px)),\r
    repeating-linear-gradient(0deg,  rgba(24,26,30,.30) 0 .5px, transparent .5px var(--mask-gap,3px));\r
  mix-blend-mode:multiply;\r
}\r
\r
/* 胶片颗粒：噪点，靠 SVG feTurbulence 生成，比多层径向渐变更像真的 */\r
html[data-param-mask-style="grain"] .shot img,\r
html[data-param-mask-style="grain"] .card3d img{\r
  filter:blur(var(--mask-blur,0.3px)) contrast(1.04) saturate(.96);\r
}\r
html[data-param-mask-style="grain"] .shot::after,\r
html[data-param-mask-style="grain"] .card3d::after{\r
  opacity:var(--mask-op,.34);\r
  background-image:var(--mask-noise,none);\r
  background-size:var(--mask-cell,140px) var(--mask-cell,140px);\r
  mix-blend-mode:overlay;\r
}\r
\r
/* 点刻版画：疏密点阵，像铜版画的底纹 */\r
html[data-param-mask-style="stipple"] .shot img,\r
html[data-param-mask-style="stipple"] .card3d img{\r
  filter:blur(var(--mask-blur,0.5px)) grayscale(.55) contrast(1.06);\r
}\r
html[data-param-mask-style="stipple"] .shot::after,\r
html[data-param-mask-style="stipple"] .card3d::after{\r
  opacity:var(--mask-op,.40);\r
  background-image:\r
    radial-gradient(circle at 20% 30%, rgba(20,22,26,.55) 0 .8px, transparent 1px),\r
    radial-gradient(circle at 70% 65%, rgba(20,22,26,.48) 0 .7px, transparent .95px),\r
    radial-gradient(circle at 45% 85%, rgba(20,22,26,.42) 0 .6px, transparent .85px);\r
  background-size:var(--mask-cell,5px) var(--mask-cell,5px);\r
  mix-blend-mode:multiply;\r
}\r
\r
/* 交叉排线：45° 双向细线，素描/蚀刻的排线感 */\r
html[data-param-mask-style="crosshatch"] .shot img,\r
html[data-param-mask-style="crosshatch"] .card3d img{\r
  filter:blur(var(--mask-blur,0.4px)) grayscale(.4) contrast(1.05);\r
}\r
html[data-param-mask-style="crosshatch"] .shot::after,\r
html[data-param-mask-style="crosshatch"] .card3d::after{\r
  opacity:var(--mask-op,.38);\r
  background-image:\r
    repeating-linear-gradient(45deg,  rgba(22,24,28,.44) 0 .6px, transparent .6px var(--mask-gap,3.4px)),\r
    repeating-linear-gradient(-45deg, rgba(22,24,28,.44) 0 .6px, transparent .6px var(--mask-gap,3.4px));\r
  mix-blend-mode:multiply;\r
}\r
\r
/* 3D 模式下的整页过渡 */\r
.trio{transition:height .35s ease}\r
\r
/* ============================================================\r
   展台（lede）：卡片坐在一条台面上\r
   两档：平面 = 薄板 + 下方柔影；立体 = 更厚、上沿暗面、中间一道高光、几乎不落影\r
   ============================================================ */\r
.trio.is-3d{overflow:visible}\r
.ledge{position:absolute;left:8px;right:8px;pointer-events:none;z-index:1}\r
.ledge::before,.ledge::after{content:"";position:absolute;left:0;right:0}\r
/* 主板：上浅下深的渐变 */\r
.ledge .plate{position:absolute;left:0;right:0;border-radius:2px}\r
.ledge .lip{position:absolute;left:0;right:0;border-radius:1px}\r
\r
/* 平面：薄板，底下一层柔光 */\r
.ledge[data-kind="shelf"] .plate{\r
  height:10px;\r
  background:linear-gradient(color-mix(in srgb,var(--led-mid,#5a5a5a) 82%,#fff 18%),var(--led-bot,#2e2e2e));\r
  border-radius:2px;\r
}\r
.ledge[data-kind="shelf"] .glow{\r
  position:absolute;left:-2px;right:-2px;top:10px;height:26px;\r
  background:linear-gradient(rgba(0,0,0,.22),rgba(0,0,0,0));\r
}\r
\r
/* 立体：上沿暗面 + 主条 + 中间高光 + 圆角收口，几乎不落影 */\r
.ledge[data-kind="shelf3d"] .plate{\r
  height:16px;\r
  background:linear-gradient(var(--led-mid,#4a4a4a) 0%,var(--led-bot,#1e1e1e) 74%,var(--led-bot,#151515) 100%);\r
  border-radius:3px;\r
  box-shadow:0 -1px 0 color-mix(in srgb,var(--led-hi,#fff) 26%,transparent) inset, 0 1px 0 rgba(0,0,0,.5);\r
}\r
.ledge[data-kind="shelf3d"] .lip{\r
  top:9px;height:1.5px;\r
  background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--led-hi,#fff) 42%,transparent) 6%,color-mix(in srgb,var(--led-hi,#fff) 42%,transparent) 94%,transparent);\r
}\r
.ledge[data-kind="shelf3d"] .glow{\r
  position:absolute;left:-1px;right:-1px;top:16px;height:7px;\r
  background:linear-gradient(rgba(0,0,0,.20),rgba(0,0,0,0));\r
}\r
\r
</style>\r
</head>\r
<body>\r

  <div class="win">\r
    <div class="top">\r
      <span class="lights"><i></i><i></i><i></i></span>\r
      <span class="nav">\r
        <b><svg viewBox="0 0 10 10"><path d="M6.4 1.6 3 5l3.4 3.4"></path></svg></b>\r
        <b><svg viewBox="0 0 10 10"><path d="M3.6 1.6 7 5l-3.4 3.4"></path></svg></b>\r
      </span>\r
      <span class="spacer"></span>\r
      <span class="urlbox">\r
        <span class="mode" id="mode" aria-hidden="true"></span>\r
        <span class="host" id="url"></span>\r
      </span>\r
